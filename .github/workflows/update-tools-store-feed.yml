name: Update Tools Store Horoshop feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest CSV from Google Sheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools-store-feed
          curl -L --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "https://docs.google.com/spreadsheets/d/e/2PACX-1vTL7Pyh2MT3MzZ3XROED7f1UqiW9VTsazXtvNISgKpj63gyRU468WU-eTwRFJBA-AgZ7iUMQGO1-ule/pub?gid=364265679&single=true&output=csv" -o tools-store-feed/horoshop.csv.tmp
          test -s tools-store-feed/horoshop.csv.tmp
          head -c 500 tools-store-feed/horoshop.csv.tmp | grep -q "Артикул"
          mv tools-store-feed/horoshop.csv.tmp tools-store-feed/horoshop.csv

      - name: Commit when feed changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tools-store-feed/horoshop.csv; then
            exit 0
          fi
          git config user.name "tools-store-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools-store-feed/horoshop.csv
          git commit -m "Update Horoshop stock feed"
          git push
