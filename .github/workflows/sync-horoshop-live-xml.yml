name: Sync live Horoshop XML

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-horoshop-live-xml.yml"
      - "tools-store-feed/parse_horoshop_live.py"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  sync-live-horoshop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Parse Horoshop XML
        run: python tools-store-feed/parse_horoshop_live.py

      - name: Commit changed live feed
        shell: bash
        run: |
          if git diff --quiet -- tools-store-feed/horoshop-live.csv tools-store-feed/horoshop-live-diagnostic.txt; then
            echo "No changes."
            exit 0
          fi
          git config user.name "tools-store-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools-store-feed/horoshop-live.csv tools-store-feed/horoshop-live-diagnostic.txt
          git commit -m "Sync live Horoshop XML feed"
          git push
