name: Sync live Horoshop XML

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-horoshop-live-xml.yml"
      - "tools-store-feed/parse_horoshop_live.py"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-live-horoshop-v3
  cancel-in-progress: true

jobs:
  sync-live-horoshop:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Build and publish live Horoshop feed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "tools-store-feed-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            python tools-store-feed/parse_horoshop_live.py
            TZ=Europe/Kyiv date "+%d.%m.%Y %H:%M:%S" > tools-store-feed/last-live-sync.txt

            git add \
              tools-store-feed/horoshop-live.csv \
              tools-store-feed/horoshop-live-diagnostic.txt \
              tools-store-feed/last-live-sync.txt

            if git diff --cached --quiet; then
              echo "No changes."
              exit 0
            fi

            git commit -m "Sync live Horoshop XML feed"

            if git push origin HEAD:main; then
              echo "Published successfully."
              exit 0
            fi

            echo "Push raced with another workflow; retrying..."
            sleep 2
          done

          echo "Failed to publish after 3 attempts."
          exit 1
