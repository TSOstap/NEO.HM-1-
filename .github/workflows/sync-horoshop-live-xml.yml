name: Sync live Horoshop XML

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-horoshop-live-xml.yml"
      - "tools-store-feed/parse_horoshop_live.py"
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-live-horoshop
  cancel-in-progress: true

jobs:
  sync-live-horoshop:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Keep live Horoshop feed fresh every 5 minutes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "tools-store-feed-bot"
          git config user.email "actions@users.noreply.github.com"

          for i in $(seq 1 35); do
            echo "Sync #$i"

            git pull --rebase origin main || true

            python tools-store-feed/parse_horoshop_live.py

            TZ=Europe/Kyiv date "+%d.%m.%Y %H:%M:%S" > tools-store-feed/last-live-sync.txt

            git add \
              tools-store-feed/horoshop-live.csv \
              tools-store-feed/horoshop-live-diagnostic.txt \
              tools-store-feed/last-live-sync.txt

            if ! git diff --cached --quiet; then
              git commit -m "Sync live Horoshop XML feed"
              git push
            else
              echo "No changes."
            fi

            if [ "$i" -lt 35 ]; then
              sleep 300
            fi
          done
