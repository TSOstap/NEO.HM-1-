name: Sync live Horoshop XML

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-horoshop-live-xml.yml"
      - "tools-store-feed/parse_horoshop_live.py"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-live-horoshop-v2
  cancel-in-progress: true

jobs:
  sync-live-horoshop:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Parse Horoshop XML
        run: python tools-store-feed/parse_horoshop_live.py

      - name: Record live sync time
        shell: bash
        run: |
          TZ=Europe/Kyiv date "+%d.%m.%Y %H:%M:%S" > tools-store-feed/last-live-sync.txt

      - name: Commit changed live feed
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          git config user.name "tools-store-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            tools-store-feed/horoshop-live.csv \
            tools-store-feed/horoshop-live-diagnostic.txt \
            tools-store-feed/last-live-sync.txt

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Sync live Horoshop XML feed"
          git push
